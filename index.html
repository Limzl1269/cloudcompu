<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Cinema - Ticketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased p-6">

    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-10 border-b border-gray-700 pb-4">
        <h1 class="text-3xl font-bold text-purple-400">Anime Cinema</h1>
        <button onclick="toggleSection('profile-section')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded font-semibold transition duration-200">My Profile</button>
    </nav>

    <!-- Main Ticketing Section -->
    <div id="booking-section" class="max-w-5xl mx-auto block">
        <h2 class="text-2xl mb-6 font-semibold">Now Showing</h2>
        
        <!-- Movie Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                <img src="suzume-poster.jpg.webp" alt="Suzume" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Suzume</h3>
                <p class="text-gray-400 text-sm mb-4">A visually stunning journey across Japan.</p>
                <button onclick="selectMovie('Suzume')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold transition duration-200">Book Tickets</button>
            </div>
            
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                <img src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg" alt="Your Name" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Your Name</h3>
                <p class="text-gray-400 text-sm mb-4">A beautiful tale of connection and time.</p>
                <button onclick="selectMovie('Your Name')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold transition duration-200">Book Tickets</button>
            </div>

            <div class="bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700">
                <img src="https://upload.wikimedia.org/wikipedia/en/6/66/Weathering_with_You_Poster.jpg" alt="Weathering With You" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Weathering With You</h3>
                <p class="text-gray-400 text-sm mb-4">Breathtaking animation and weather effects.</p>
                <button onclick="selectMovie('Weathering With You')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold transition duration-200">Book Tickets</button>
            </div>
        </div>

        <!-- Checkout Form -->
        <div id="checkout-form" class="hidden bg-gray-800 p-6 rounded-lg max-w-md mx-auto border border-gray-700">
            <h3 class="text-xl font-bold mb-4">Complete Reservation</h3>
            <p id="selected-movie-title" class="text-purple-400 mb-4 font-bold text-lg"></p>
            
            <form action="/book" method="POST">
                <input type="hidden" id="hidden-movie-title" name="movie_title" value="">
                
                <!-- NEW: Ask for the user's email to tie the booking to a person -->
                <label class="block text-sm mb-2 text-gray-300">Email Address (For Receipt):</label>
                <input type="email" name="email" placeholder="john@example.com" required class="w-full p-3 mb-4 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-purple-500">
                
                <label class="block text-sm mb-2 text-gray-300">Ticket Quantity:</label>
                <input type="number" name="quantity" min="1" max="10" value="1" class="w-full p-3 mb-6 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-purple-500">
                
                <button type="submit" class="bg-green-600 hover:bg-green-500 w-full py-3 rounded font-bold transition duration-200">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- User Profile Section -->
    <div id="profile-section" class="max-w-md mx-auto hidden bg-gray-800 p-6 rounded-lg border border-gray-700">
        
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-bold">Manage Profile</h2>
            <button onclick="toggleSection('booking-section')" class="text-sm bg-gray-600 hover:bg-gray-500 px-3 py-1 rounded transition duration-200">← Back to Movies</button>
        </div>
        
        <!-- Update Profile Form -->
        <form action="/update-profile" method="POST" class="mb-8">
            <label class="block text-sm mb-2 text-gray-300">Full Name:</label>
            <input type="text" name="full_name" placeholder="John Doe" required class="w-full p-3 mb-4 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
            
            <label class="block text-sm mb-2 text-gray-300">Email Address:</label>
            <input type="email" name="email" placeholder="john@example.com" required class="w-full p-3 mb-4 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">

            <label class="block text-sm mb-2 text-gray-300">Phone Number:</label>
            <input type="tel" name="phone" placeholder="012-3456789" class="w-full p-3 mb-6 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
            
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 w-full py-3 rounded font-bold transition duration-200">Save Profile</button>
        </form>

        <!-- Delete Profile Form -->
        <form action="/delete-profile" method="POST" class="border-t border-gray-700 pt-6">
            <label class="block text-sm mb-2 text-red-400 font-semibold">Danger Zone: Delete Account</label>
            <p class="text-xs text-gray-400 mb-3">Please confirm your email address to delete your account.</p>
            <div class="flex gap-2">
                <input type="email" name="email" placeholder="Enter email to delete" required class="w-full p-2 bg-gray-700 rounded text-white border border-red-900 focus:outline-none">
                <button type="submit" class="bg-red-600 hover:bg-red-500 px-4 rounded font-bold transition duration-200">Delete</button>
            </div>
        </form>
    </div>

    <script>
        function selectMovie(movieName) {
            document.getElementById('checkout-form').classList.remove('hidden');
            document.getElementById('selected-movie-title').innerText = "Booking for: " + movieName;
            document.getElementById('hidden-movie-title').value = movieName;
            document.getElementById('checkout-form').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleSection(sectionId) {
            const profile = document.getElementById('profile-section');
            const booking = document.getElementById('booking-section');
            
            if (sectionId === 'profile-section') {
                profile.classList.remove('hidden');
                booking.classList.add('hidden');
            } else {
                profile.classList.add('hidden');
                booking.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
