<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Cinema - Ticketing</title>
    <!-- Using Tailwind CSS for instant modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased p-6">

    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-10 border-b border-gray-700 pb-4">
        <h1 class="text-3xl font-bold text-purple-400">Anime Cinema</h1>
        <button onclick="toggleSection('profile-section')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">My Profile (CRUD)</button>
    </nav>

    <!-- Main Ticketing Section -->
    <div id="booking-section" class="max-w-5xl mx-auto block">
        <h2 class="text-2xl mb-6">Now Showing</h2>
        
        <!-- Movie Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Movie Card 1 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                <img src="suzume-poster.jpg.webp" alt="Suzume" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Suzume</h3>
                <p class="text-gray-400 text-sm mb-4">A visually stunning journey across Japan.</p>
                <button onclick="selectMovie('Suzume')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold">Book Tickets</button>
            </div>
            
            <!-- Movie Card 2 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                <img src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg" alt="Your Name" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Your Name</h3>
                <p class="text-gray-400 text-sm mb-4">A beautiful tale of connection and time.</p>
                <button onclick="selectMovie('Your Name')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold">Book Tickets</button>
            </div>

            <!-- Movie Card 3 -->
            <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                <img src="https://upload.wikimedia.org/wikipedia/en/6/66/Weathering_with_You_Poster.jpg" alt="Weathering With You" class="rounded w-full h-64 object-cover mb-4">
                <h3 class="text-xl font-bold mb-2">Weathering With You</h3>
                <p class="text-gray-400 text-sm mb-4">Breathtaking animation and weather effects.</p>
                <button onclick="selectMovie('Weathering With You')" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold">Book Tickets</button>
            </div>
        </div>

        <!-- Checkout Form (Hidden until a movie is selected) -->
        <div id="checkout-form" class="hidden bg-gray-800 p-6 rounded-lg max-w-md mx-auto">
            <h3 class="text-xl font-bold mb-4">Complete Reservation</h3>
            <p id="selected-movie-title" class="text-purple-400 mb-4 font-bold"></p>
            
            <form action="/book" method="POST">
                <label class="block text-sm mb-2">Ticket Quantity:</label>
                <input type="number" min="1" max="10" value="1" class="w-full p-2 mb-4 bg-gray-700 rounded text-white border border-gray-600">
                
                <!-- This satisfies the requirement to complete a reservation -->
                <button type="submit" class="bg-green-600 hover:bg-green-500 w-full py-2 rounded font-bold">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- User Profile CRUD Section (Hidden by default) -->
    <div id="profile-section" class="max-w-md mx-auto hidden bg-gray-800 p-6 rounded-lg mt-10">
        <h2 class="text-2xl mb-6 border-b border-gray-700 pb-2">Manage Profile</h2>
        
        <form action="/update-profile" method="POST">
            <label class="block text-sm mb-2">Full Name:</label>
            <input type="text" placeholder="John Doe" class="w-full p-2 mb-4 bg-gray-700 rounded text-white border border-gray-600">
            
            <label class="block text-sm mb-2">Email:</label>
            <input type="email" placeholder="john@example.com" class="w-full p-2 mb-6 bg-gray-700 rounded text-white border border-gray-600">
            
            <div class="flex justify-between gap-4">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 w-full py-2 rounded font-bold">Update (U)</button>
                <button type="button" class="bg-red-600 hover:bg-red-500 w-full py-2 rounded font-bold">Delete Account (D)</button>
            </div>
        </form>
    </div>

    <!-- Basic JavaScript to handle the Single Page Application feel -->
    <script>
        function selectMovie(movieName) {
            document.getElementById('checkout-form').classList.remove('hidden');
            document.getElementById('selected-movie-title').innerText = "Booking for: " + movieName;
            // Scroll to checkout
            document.getElementById('checkout-form').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleSection(sectionId) {
            const profile = document.getElementById('profile-section');
            const booking = document.getElementById('booking-section');
            
            if (sectionId === 'profile-section') {
                profile.classList.remove('hidden');
                booking.classList.add('hidden');
            } else {
                profile.classList.add('hidden');
                booking.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
